<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Артём Петров</title>
<meta name="description" content="Артём Петров, продакт-менеджер. Резюме и проекты: Smelo и Max.">
<meta property="og:title" content="Артём Петров">
<meta property="og:description" content="Открой холодильник: внутри резюме и проекты.">
<meta property="og:image" content="https://artem.pet/assets/og.jpg">
<meta property="og:url" content="https://artem.pet/">
<meta name="theme-color" content="#EAE2D5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='2' width='18' height='28' rx='5' fill='%2397A88F'/%3E%3Crect x='10' y='8' width='2.5' height='8' rx='1.2' fill='%23F4EEE3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat&family=JetBrains+Mono:wght@400;500&family=Onest:wght@400;500;800&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="assets/kitchen.jpg">
<style>
:root {
  --ink: #2A2620;
  --muted: #8A7757;
  --paper: #FAF5EC;
  --wall: #EAE2D5;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  --hand: "Caveat", cursive;
  --ease: cubic-bezier(.6, .05, .25, 1);
  --cam: 1s cubic-bezier(.65, 0, .25, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--wall);
  color: var(--ink);
  font: 400 16px/1.5 "Onest", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
a { color: inherit; }
button { font: inherit; color: inherit; }

/* Сцена: фото кухни, масштаб считается от ширины кадра 1440 */
.stage { position: relative; height: 100svh; overflow: hidden; container-type: size; }
.cq {
  --top: 0px;
  --h: calc(100cqh - var(--top));
  --w: max(100cqw, calc(var(--h) * 16 / 9));
  --u: calc(var(--w) / 1440);
  --left: clamp(calc(100cqw - var(--w)), calc(50cqw - var(--w) * 0.628), 0px);
}
.scene {
  position: absolute;
  left: var(--left);
  top: calc(var(--top) + (var(--h) - var(--w) * 9 / 16) / 2);
  width: var(--w);
  height: calc(var(--w) * 9 / 16);
  background: url(assets/kitchen.jpg) 0 0 / 100% 100% no-repeat;
  perspective: calc(2600 * var(--u));
  transform-origin: 0 0;
  transition: transform var(--cam);
}

.cavity, .glow, .floor-light, .door { position: absolute; }
.cavity {
  left: calc(744 * var(--u)); top: calc(98 * var(--u));
  width: calc(322 * var(--u)); height: calc(594 * var(--u));
  border-radius: calc(36 * var(--u)) calc(36 * var(--u)) calc(10 * var(--u)) calc(10 * var(--u));
  background: #DAD0BF; overflow: hidden;
  opacity: 0; transition: opacity .2s;
}
.glow {
  left: calc(690 * var(--u)); top: calc(40 * var(--u));
  width: calc(430 * var(--u)); height: calc(720 * var(--u));
  background: radial-gradient(closest-side, rgba(255, 238, 196, .55), rgba(255, 238, 196, 0));
  opacity: 0; transition: opacity .9s .25s; pointer-events: none;
}
.floor-light {
  left: calc(600 * var(--u)); top: calc(690 * var(--u));
  width: calc(640 * var(--u)); height: calc(130 * var(--u));
  background: radial-gradient(closest-side, rgba(255, 231, 176, .7), rgba(255, 231, 176, 0));
  opacity: 0; transition: opacity .9s .3s; pointer-events: none;
}
.is-open .cavity, .is-open .glow, .is-open .floor-light { opacity: 1; }

.door {
  left: calc(731 * var(--u)); top: calc(84 * var(--u));
  width: calc(347 * var(--u)); height: calc(620 * var(--u));
  transform-style: preserve-3d;
  transform-origin: 100% 50%;
  transition: transform .95s var(--ease);
}
.is-open .door { transform: rotateY(104deg); }
.door-face, .door-back {
  position: absolute; inset: 0;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border-radius: calc(12 * var(--u));
}
.door-face {
  background: url(assets/kitchen.jpg) calc(-731 * var(--u)) calc(-84 * var(--u)) / var(--w) calc(var(--w) * 9 / 16) no-repeat;
  cursor: pointer;
}
.door-back {
  transform: rotateY(180deg);
  background:
    linear-gradient(180deg, transparent 0 calc(118 * var(--u)), rgba(255, 255, 255, .55) calc(118 * var(--u)) calc(158 * var(--u)), rgba(150, 160, 160, .55) calc(158 * var(--u)) calc(161 * var(--u)), transparent calc(161 * var(--u))) 0 0 / 100% calc(150 * var(--u)) repeat-y,
    linear-gradient(90deg, #BFC2B8, #E3DFD5 22%, #EFEBE3 60%, #D7D2C7);
  box-shadow: inset 0 0 0 calc(6 * var(--u)) #8E9E87, inset 0 0 0 calc(16 * var(--u)) #CFCBC1, inset calc(30 * var(--u)) 0 calc(40 * var(--u)) rgba(60, 50, 30, .15);
}
.handle-hit {
  position: absolute; left: calc(30 * var(--u)); top: calc(140 * var(--u));
  width: calc(36 * var(--u)); height: calc(190 * var(--u));
  border: 0; padding: 0; background: none; cursor: pointer; border-radius: 99px;
}
.handle-hit::after {
  content: ""; position: absolute; inset: calc(-6 * var(--u));
  border-radius: 99px; border: 1.5px solid rgba(255, 255, 255, .9);
  animation: ping 2.4s ease-out infinite;
}
@keyframes ping { 0% { opacity: .9; transform: scale(.9); } 70%, 100% { opacity: 0; transform: scale(1.25); } }

/* Магниты */
.magnet {
  position: absolute; left: calc(var(--x) * var(--u)); top: calc(var(--y) * var(--u));
  transform: translate(calc(var(--dx, 0) * var(--u)), calc(var(--dy, 0) * var(--u))) rotate(var(--r, 0deg));
  border: 0; padding: 0; background: none; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
  filter: drop-shadow(calc(-5 * var(--u)) calc(9 * var(--u)) calc(7 * var(--u)) rgba(35, 28, 15, .3)) drop-shadow(0 1px 1px rgba(30, 24, 12, .35));
  transition: filter .2s, transform .2s;
}
.magnet:hover, .magnet:focus-visible { filter: drop-shadow(calc(-8 * var(--u)) calc(15 * var(--u)) calc(11 * var(--u)) rgba(35, 28, 15, .3)) drop-shadow(0 2px 2px rgba(30, 24, 12, .3)); outline: none; }
.magnet.dragging { cursor: grabbing; transition: filter .2s; z-index: 5; }
.magnet.wiggle { animation: wiggle .5s; }
@keyframes wiggle { 25% { rotate: -4deg; } 75% { rotate: 4deg; } }
.magnet .tip {
  position: absolute; left: 50%; bottom: calc(100% + 8 * var(--u)); translate: -50% 4px;
  white-space: nowrap; font: 400 12px/1 var(--mono); color: #F6F1E8; background: var(--ink);
  padding: 6px 9px; border-radius: 6px; opacity: 0; pointer-events: none; transition: opacity .15s, translate .15s;
  rotate: calc(-1 * var(--r, 0deg));
}
.magnet:hover .tip, .magnet:focus-visible .tip { opacity: 1; translate: -50% 0; }
.is-open .magnet .tip { display: none; }

.m-smelo { width: calc(108 * var(--u)); height: calc(108 * var(--u)); }
.m-smelo .body {
  position: absolute; inset: 0; border-radius: calc(26 * var(--u));
  background: linear-gradient(135deg, #3A3640, #232027);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .16), inset 0 calc(14 * var(--u)) calc(24 * var(--u)) rgba(255, 255, 255, .1);
  display: grid; place-items: center;
}
.m-smelo svg { width: 65%; height: 65%; }
.m-polaroid { width: calc(116 * var(--u)); height: calc(138 * var(--u)); }
.m-polaroid .body { position: absolute; inset: 0; background: linear-gradient(#FFF, #F1EEE8); }
.m-polaroid .photo {
  position: absolute; left: calc(8 * var(--u)); top: calc(8 * var(--u)); right: calc(8 * var(--u)); height: calc(98 * var(--u));
  background: linear-gradient(160deg, #9FA79A, #6F786D) center / cover;
  display: grid; place-items: center; font: 400 calc(9 * var(--u))/1 var(--mono); color: rgba(255, 255, 255, .8);
}
.m-polaroid .caption { position: absolute; left: 0; right: 0; bottom: calc(6 * var(--u)); text-align: center; font: 400 calc(17 * var(--u))/1 var(--hand); color: #3B3A44; }
.pin {
  position: absolute; left: 50%; top: calc(-9 * var(--u)); width: calc(18 * var(--u)); height: calc(18 * var(--u)); margin-left: calc(-9 * var(--u));
  border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFF, #C9CCD1 45%, #8A8F98);
  box-shadow: calc(-2 * var(--u)) calc(3 * var(--u)) calc(3 * var(--u)) rgba(30, 24, 12, .35);
}
.pin.red { background: radial-gradient(circle at 35% 30%, #FF9B80, #E0573A 50%, #A3341F); }
.m-note { width: calc(126 * var(--u)); height: calc(150 * var(--u)); }
.m-note .body {
  position: absolute; inset: 0;
  background:
    repeating-linear-gradient(180deg, transparent 0 calc(39 * var(--u)), rgba(159, 180, 214, .6) calc(39 * var(--u)) calc(40 * var(--u)), transparent calc(40 * var(--u)) calc(62 * var(--u))) 0 0 / 100% calc(22 * var(--u)),
    linear-gradient(#FFFDF7, #F3EFE4);
  background-position: 0 calc(18 * var(--u)), 0 0;
  padding: calc(12 * var(--u)) calc(10 * var(--u));
  font: 400 calc(18 * var(--u))/calc(22 * var(--u)) var(--hand); color: #2D3A6B; text-align: left;
}
.m-note s { text-decoration-thickness: 1px; }
.m-max { width: calc(88 * var(--u)); height: calc(88 * var(--u)); }
.m-max .body {
  position: absolute; inset: 0; border-radius: 50%;
  background: radial-gradient(circle at 32% 28%, rgba(255, 255, 255, .45), rgba(255, 255, 255, 0) 45%), linear-gradient(135deg, #E9B949, #C98E1E);
  display: grid; place-items: center; font: 500 calc(26 * var(--u))/1 "Onest", sans-serif; letter-spacing: -.02em; color: #3A2A08;
}
.m-contact { width: calc(46 * var(--u)); height: calc(46 * var(--u)); }
.m-contact .body {
  position: absolute; inset: 0; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #FFF, #EFEBE4 55%, #DDD7CC);
  box-shadow: inset 0 0 0 calc(3 * var(--u)) rgba(255, 255, 255, .6), inset 0 0 0 calc(4 * var(--u)) rgba(0, 0, 0, .05);
  display: grid; place-items: center; font: 500 calc(14 * var(--u))/1 var(--mono); color: var(--ink);
}

/* Текст на стене */
.intro {
  position: absolute; z-index: 2;
  left: max(clamp(24px, 5vw, 80px), calc(var(--left) + 112 * var(--u)));
  top: 50%; translate: 0 -58%;
  width: min(calc(560 * var(--u)), calc(100cqw - 48px));
  transition: opacity .4s;
}
.is-open .intro, .is-open .wall-links { opacity: 0; pointer-events: none; }
.eyebrow { font: 400 max(12px, calc(14 * var(--u)))/1 var(--mono); letter-spacing: .02em; opacity: .6; margin: 0 0 calc(24 * var(--u)); }
.intro h1 { font-weight: 500; font-size: max(34px, calc(76 * var(--u))); line-height: 1; letter-spacing: -.045em; margin: 0 0 calc(24 * var(--u)); }
.lead { font-size: max(16px, calc(20 * var(--u))); line-height: 1.5; opacity: .8; margin: 0 0 calc(24 * var(--u)); max-width: calc(460 * var(--u)); }
.hint { display: flex; align-items: center; gap: 10px; font: 400 max(11px, calc(13 * var(--u)))/1.4 var(--mono); opacity: .8; margin: 0; }
.hint::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: #C8553D; animation: blink 2s infinite; }
@keyframes blink { 50% { opacity: .3; } }
.wall-links {
  position: absolute; z-index: 2; left: max(clamp(24px, 5vw, 80px), calc(var(--left) + 112 * var(--u))); bottom: 5.5cqh;
  display: flex; gap: calc(28 * var(--u)); font: 500 max(12px, calc(13 * var(--u)))/1 var(--mono);
  transition: opacity .4s;
}
.wall-links a { text-decoration: none; opacity: .8; }
.wall-links a:hover { opacity: 1; text-decoration: underline; }

@media (max-aspect-ratio: 31/20) {
  .cq { --top: 150px; }
  .stage::before { content: ""; position: absolute; inset: 0 0 auto; height: 220px; z-index: 1; background: linear-gradient(var(--wall) 68%, rgba(234, 226, 213, 0)); pointer-events: none; transition: opacity .4s; }
  .is-open .stage::before { opacity: 0; }
  .intro { top: 34px; translate: none; left: 24px; }
  .intro h1 { font-size: 36px; margin-bottom: 12px; }
  .intro-top { margin-bottom: 10px; }
  .lead, .wall-links { display: none; }
}

/* Внутри холодильника: та же картинка, что в камере, только камера подъехала */
.mini { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; }
.resume {
  position: fixed; left: 0; top: 0; z-index: 10; width: 100vw; height: 100svh;
  overflow: hidden; overscroll-behavior: contain; background: var(--paper);
  transform-origin: 0 0; visibility: hidden; outline: none;
  transition: transform var(--cam), border-radius var(--cam);
}
.resume.show { visibility: visible; }
.resume.ready { overflow-y: auto; }
.r-top { position: sticky; top: 0; z-index: 3; height: 0; opacity: 0; transition: opacity .4s; }
.resume.ready .r-top { opacity: 1; }
.r-bar { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; font: 400 13px/1 var(--mono); }
.r-bar button#closeFridge, .r-right { background: rgba(250, 245, 236, .86); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-radius: 999px; }
.r-bar button#closeFridge { border: 0; padding: 10px 14px; cursor: pointer; white-space: nowrap; }
.r-right { display: flex; align-items: center; gap: 10px; padding: 4px 4px 4px 14px; }
.r-right span { opacity: .55; }
@media (max-width: 520px) { .r-right { padding-left: 4px; } .r-right span { display: none; } }
.lamp-bay {
  display: grid; place-items: center; text-align: center;
  min-height: clamp(600px, 42.86vw, 768px); padding: 96px 24px 15%;
  background: #DAD0BF url(assets/lamp.jpg) center bottom / cover no-repeat;
}
.lamp-in { max-width: 700px; }
.lamp-in h2 { font-weight: 500; font-size: clamp(40px, 5.4vw, 72px); line-height: 1; letter-spacing: -.045em; margin: 10px 0 16px; }
.lamp-in p.about { font-size: clamp(15px, 1.35vw, 19px); line-height: 1.5; opacity: .82; margin: 0 0 22px; }
.lamp-in .btns { justify-content: center; }
.bay { position: relative; overflow: hidden; background: #DAD0BF; }
.bay-in {
  position: relative; left: 50%; translate: -50% 0; container-type: inline-size;
  width: clamp(896px, 100vw, 1792px); aspect-ratio: 1792 / 768;
  background: url(assets/shelf.jpg) 0 0 / 100% 100% no-repeat;
}
.gable, .print { position: absolute; mix-blend-mode: multiply; }
.gable { top: 11.2%; height: 9.8%; width: 16%; background: var(--c); clip-path: polygon(6% 0, 97% 0, 100% 100%, 0 100%); }
.print { top: 20.9%; width: 15.9%; height: 68.7%; display: flex; flex-direction: column; color: #1D1A16; overflow: hidden; }
.g1, .front { left: 30.35%; }
.g2, .facts { left: 52.5%; }
.front .block { flex: 0 0 58%; display: flex; flex-direction: column; justify-content: flex-end; padding: 1.2cqw; background: var(--c); color: #FFF; }
.front .block b { font: 800 var(--fs)/1 "Onest", sans-serif; letter-spacing: -.03em; }
.front .block i { font: 500 1.3cqw/1.2 "Onest", sans-serif; margin-top: .3cqw; }
.front .low { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 1.1cqw 1.2cqw; }
.front .low b { font: 800 1.75cqw/1.1 "Onest", sans-serif; letter-spacing: -.02em; color: var(--c); }
.front .low span { font: 500 1.12cqw/1.35 var(--mono); }
.facts { padding: .9cqw; }
.nf { flex: 1; display: flex; flex-direction: column; border: .17cqw solid; padding: .6cqw .8cqw; }
.nf h4 { font: 800 1.62cqw/1.05 "Onest", sans-serif; letter-spacing: -.02em; margin: 0; }
.nf .srv { font: 500 1.15cqw/1.3 "Onest", sans-serif; padding: .3cqw 0 .5cqw; border-bottom: .6cqw solid; }
.nf .fr { display: flex; justify-content: space-between; align-items: baseline; gap: .6cqw; padding: .5cqw 0; border-bottom: .09cqw solid; font: 500 1.22cqw/1.2 "Onest", sans-serif; }
.nf .fr b { font-weight: 800; white-space: nowrap; }
.nf small { margin-top: auto; font: 500 1cqw/1.25 var(--mono); }
.r-wrap { max-width: 880px; margin: 0 auto; padding: 72px 24px 120px; }
.label { font: 500 12px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 12px 22px; border-radius: 999px;
  border: 1px solid rgba(42, 38, 32, .3); background: none; text-decoration: none; font-weight: 500; cursor: pointer;
  transition: background .2s, border-color .2s;
}
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: #F6F1E8; }
.btn.primary:hover { background: #45403A; }
.shelf { height: 4px; margin: 56px 0; background: linear-gradient(#D4E0E4 0 3px, #9AABB2 3px); border-radius: 1px; opacity: .9; }
.r-sec { display: grid; grid-template-columns: 170px 1fr; gap: 40px; }
.r-sec h3 { font: 500 12px/1.6 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
.job + .job { margin-top: 28px; }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
.row b { font-weight: 500; font-size: 20px; }
.row time, .row span { font: 400 13px/1 var(--mono); color: var(--muted); white-space: nowrap; }
.job p { margin: 6px 0 0; opacity: .72; max-width: 600px; }
.projects { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.proj {
  text-align: left; padding: 20px 22px; border-radius: 14px; border: 1px solid rgba(42, 38, 32, .1); background: rgba(255, 255, 255, .7);
  cursor: pointer; transition: border-color .2s, translate .2s;
}
.proj:hover { border-color: rgba(42, 38, 32, .35); translate: 0 -2px; }
.proj b { display: block; font-weight: 500; font-size: 20px; margin-bottom: 6px; }
.proj span { display: block; opacity: .7; font-size: 15px; }
.proj small { display: block; margin-top: 10px; font: 400 12px/1 var(--mono); color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; margin: 0; padding: 0; }
.chips li { padding: 7px 14px; border-radius: 999px; border: 1px solid rgba(42, 38, 32, .18); font-size: 15px; }
.contacts { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; font-size: 18px; }
.contacts span { display: inline-block; width: 96px; font: 400 13px/1 var(--mono); color: var(--muted); }
.contacts a { text-decoration: none; border-bottom: 1px solid rgba(42, 38, 32, .25); }
.contacts a:hover { border-color: var(--ink); }
@media (max-width: 720px) {
  .r-sec { grid-template-columns: 1fr; gap: 18px; }
  .projects { grid-template-columns: 1fr; }
  .shelf { margin: 44px 0; }
  .row { flex-direction: column; gap: 4px; }
}

/* Карточка проекта */
dialog.project {
  width: min(1000px, calc(100vw - 32px)); max-height: calc(100svh - 32px); padding: 0; border: 0; border-radius: 20px;
  background: var(--paper); color: var(--ink); box-shadow: 0 30px 80px rgba(20, 16, 10, .35); overflow: auto;
}
dialog.project::backdrop { background: rgba(26, 23, 18, .45); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
dialog.project[open] { animation: pop .35s var(--ease); }
@keyframes pop { from { opacity: 0; translate: 0 16px; scale: .98; } }
.p-inner { display: grid; grid-template-columns: auto 1fr; gap: 44px; padding: 40px 48px 40px 40px; position: relative; }
.p-close { position: absolute; top: 16px; right: 16px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(42, 38, 32, .06); font-size: 24px; line-height: 1; cursor: pointer; }
.p-close:hover { background: rgba(42, 38, 32, .12); }
.shots { display: flex; gap: 16px; }
.phone { width: 160px; height: 336px; border-radius: 30px; background: #16151A; padding: 6px; position: relative; flex: none; }
.phone::before { content: ""; position: absolute; left: 58px; top: 14px; width: 44px; height: 12px; border-radius: 6px; background: #16151A; z-index: 1; }
.phone .screen { width: 100%; height: 100%; border-radius: 25px; background: #EDEAF6 center top / cover no-repeat; display: grid; place-items: center; text-align: center; font: 400 10px/1.4 var(--mono); color: rgba(42, 38, 32, .5); }
.p-info { display: flex; flex-direction: column; gap: 18px; align-self: center; }
.p-head { display: flex; align-items: center; gap: 14px; }
.p-head .logo { width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.p-head h2 { margin: 0; font-weight: 500; font-size: 40px; letter-spacing: -.04em; }
.p-info p { margin: 0; font-size: 17px; line-height: 1.5; opacity: .82; max-width: 380px; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }

const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const wait = ms => new Promise(r => setTimeout(r, reduceMotion ? 0 : ms));

// Язык: ссылка ?lang=en, потом прошлый выбор, потом язык браузера
const LANGS = ["ru", "en"];
function initialLang() {
  const fromUrl = new URLSearchParams(location.search).get("lang");
  if (LANGS.includes(fromUrl)) return fromUrl;
  try { const saved = localStorage.getItem("lang"); if (LANGS.includes(saved)) return saved; } catch {}
  return (navigator.languages || [navigator.language]).some(l => /^(ru|uk|be|kk)/i.test(l)) ? "ru" : "en";
}
let lang = initialLang();
const linkUrl = id => { const u = CONTENT.links[id].url; return (typeof u === "object" ? u[lang] : u) || ""; };

// Отрисовать тексты и ссылки. Элементы с пустой ссылкой скрываются.
function render() {
  const t = CONTENT[lang];
  document.documentElement.lang = lang;
  document.title = t.ui.name;
  $$("[data-i18n]").forEach(el => { el.textContent = t.ui[el.dataset.i18n]; });
  $$("[data-i18n-html]").forEach(el => { el.innerHTML = t.ui[el.dataset.i18nHtml]; });
  $$("[data-i18n-aria]").forEach(el => { el.setAttribute("aria-label", t.ui[el.dataset.i18nAria]); });
  $$("[data-text]").forEach(el => { el.textContent = t.text[el.dataset.text] || ""; });
  $$("[data-link]").forEach(el => { const url = linkUrl(el.dataset.link); if (url) el.href = url; (el.closest("li") || el).hidden = !url; });
  $$("[data-show]").forEach(el => { el.textContent = CONTENT.links[el.dataset.show].label; });
  $$('.magnet[data-action^="link:"]').forEach(el => { el.hidden = !linkUrl(el.dataset.action.slice(5)); });
  $$("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  $("#shelves").innerHTML = t.jobs.map(j => `<article class="bay"><div class="bay-in" style="--c:${j.color};--fs:${j.fs}">
    <div class="gable g1"></div><div class="gable g2"></div>
    <div class="print front"><div class="block"><b>${esc(j.name)}</b>${j.sub ? `<i>${esc(j.sub)}</i>` : ""}</div><div class="low"><b>${esc(j.role)}</b><span>${esc(j.net)}<br>${esc(j.best)}</span></div></div>
    <div class="print facts"><div class="nf"><h4>${esc(t.ui.factsTitle)}</h4><div class="srv">${esc(j.serving)}</div>${j.facts.map(([k, v]) => `<div class="fr"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join("")}<small>${esc(t.ui.factsFoot)}</small></div></div>
    <p class="sr-only">${esc(j.text)}</p>
  </div></article>`).join("");
  $("#skills").innerHTML = t.skills.map(s => `<li>${esc(s)}</li>`).join("");
  $("#education").innerHTML = t.education.map(e => `<div class="job"><div class="row"><b>${esc(e.title)}</b><span>${esc(e.years)}</span></div>${e.sub ? `<p>${esc(e.sub)}</p>` : ""}</div>`).join("");
  buildMini();
}
// В камере лежит копия содержимого: при открытии двери видно то же, что и после наезда камеры
function buildMini() {
  const cavity = $(".cavity"), mini = $("#rBody").cloneNode(true);
  mini.removeAttribute("id");
  $$("[id]", mini).forEach(el => el.removeAttribute("id"));
  mini.className = "mini"; mini.inert = true;
  cavity.replaceChildren(mini);
  fitMini();
}
function fitMini() {
  const mini = $(".mini"), cavity = $(".cavity");
  mini.style.width = innerWidth + "px";
  mini.style.transform = `scale(${cavity.offsetWidth / innerWidth})`;
}
addEventListener("resize", () => fitMini());
function setLang(next) {
  lang = next;
  try { localStorage.setItem("lang", next); } catch {}
  const url = new URL(location.href); url.searchParams.set("lang", next); history.replaceState(null, "", url);
  render();
}
$$("[data-lang]").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));
render();
if (CONTENT.photo) { const p = $("#photo"); p.textContent = ""; p.style.backgroundImage = `url(${CONTENT.photo})`; }

// Холодильник
const body = document.body, resume = $("#resume");
let state = "closed";
const scene = $("#scene");
// Сцена и резюме двигаются одной камерой: камера холодильника становится экраном
function camera() {
  const was = scene.style.transform;
  scene.style.transition = "none"; scene.style.transform = "";
  const cavity = $(".cavity"), R = cavity.getBoundingClientRect(), S = scene.getBoundingClientRect();
  const radius = parseFloat(getComputedStyle(cavity).borderTopLeftRadius) || 0;
  scene.style.transform = was; void scene.offsetWidth; scene.style.transition = "";
  const k = innerWidth / R.width;
  return {
    zoom: `translate(${-S.left - k * (R.left - S.left)}px, ${-S.top - k * (R.top - S.top)}px) scale(${k})`,
    small: `translate(${R.left}px, ${R.top}px) scale(${1 / k})`,
    height: R.height * k + "px", radius: `${radius * k}px ${radius * k}px 0 0`,
  };
}
async function openFridge() {
  if (state !== "closed") return;
  state = "busy";
  body.classList.add("is-open");
  await wait(820);
  const c = camera();
  resume.style.transition = "none";
  Object.assign(resume.style, { height: c.height, transform: c.small, borderRadius: c.radius });
  resume.classList.add("show");
  void resume.offsetWidth;
  resume.style.transition = "";
  Object.assign(resume.style, { transform: "none", borderRadius: "0" });
  scene.style.transform = c.zoom;
  await wait(1050);
  resume.style.height = "";
  resume.classList.add("ready");
  resume.focus({ preventScroll: true });
  state = "open";
}
async function closeFridge() {
  if (state !== "open") return;
  state = "busy";
  if (resume.scrollTop > 0) {
    resume.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
    await wait(650);
    resume.scrollTop = 0;
  }
  const c = camera();
  resume.classList.remove("ready");
  Object.assign(resume.style, { height: c.height, transform: c.small, borderRadius: c.radius });
  scene.style.transform = "";
  await wait(1050);
  resume.classList.remove("show");
  body.classList.remove("is-open");
  await wait(950);
  state = "closed";
  $("#handle").focus({ preventScroll: true });
}
$("#handle").addEventListener("click", openFridge);
$("#doorFace").addEventListener("click", e => { if (e.target === e.currentTarget) openFridge(); });
$("#closeFridge").addEventListener("click", closeFridge);

// Карточка проекта
const dlg = $("#project");
function openProject(id) {
  const p = { ...CONTENT.projects[id], ...CONTENT[lang].projects[id] };
  $("#pTitle").textContent = p.title;
  $("#pLogo").innerHTML = p.logo;
  $("#pDesc").textContent = p.desc;
  $("#pRole").textContent = p.role;
  $("#pTags").innerHTML = p.tags.map(t => `<span>${esc(t)}</span>`).join("");
  $("#pShots").innerHTML = p.shots.map(src => `<div class="phone"><div class="screen" style="background-image:url(${esc(src)})"></div></div>`).join("");
  const bot = $("#pBot"), fig = $("#pFigma");
  bot.hidden = !p.bot; bot.href = p.bot || "#";
  fig.hidden = !p.figma; fig.href = p.figma || "#";
  dlg.showModal();
}
$("#pClose").addEventListener("click", () => dlg.close());
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && state === "open" && !dlg.open) closeFridge(); });

function act(action, el) {
  const [kind, arg] = action.split(":");
  if (kind === "project") openProject(arg);
  else if (kind === "link") window.open(linkUrl(arg), "_blank", "noopener");
  else if (kind === "wiggle") { el.classList.remove("wiggle"); void el.offsetWidth; el.classList.add("wiggle"); }
}
$$(".proj").forEach(el => el.addEventListener("click", () => act(el.dataset.action, el)));

// Магниты можно таскать по двери. Короткий клик без сдвига срабатывает как нажатие.
const door = $("#door");
$$(".magnet").forEach(m => {
  let sx, sy, ox, oy, moved = false, dragging = false;
  m.addEventListener("pointerdown", e => {
    if (state !== "closed") return;
    dragging = true; moved = false; sx = e.clientX; sy = e.clientY;
    ox = parseFloat(m.style.getPropertyValue("--dx") || 0); oy = parseFloat(m.style.getPropertyValue("--dy") || 0);
    m.setPointerCapture(e.pointerId);
  });
  m.addEventListener("pointermove", e => {
    if (!dragging) return;
    const u = door.offsetWidth / 347;
    const dx = (e.clientX - sx) / u, dy = (e.clientY - sy) / u;
    if (!moved && Math.hypot(e.clientX - sx, e.clientY - sy) < 5) return;
    moved = true; m.classList.add("dragging");
    const x = parseFloat(m.style.getPropertyValue("--x")), y = parseFloat(m.style.getPropertyValue("--y"));
    const w = m.offsetWidth / u, h = m.offsetHeight / u;
    const nx = Math.min(Math.max(ox + dx, -x + 6), 347 - w - x - 6);
    const ny = Math.min(Math.max(oy + dy, -y + 6), 620 - h - y - 6);
    m.style.setProperty("--dx", nx); m.style.setProperty("--dy", ny);
  });
  const end = () => { if (!dragging) return; dragging = false; m.classList.remove("dragging"); };
  m.addEventListener("pointerup", end);
  m.addEventListener("pointercancel", end);
  m.addEventListener("click", e => { e.stopPropagation(); if (moved) { moved = false; return; } act(m.dataset.action, m); });
});
</script>
</body>
